<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Truck Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26215C">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <script>
    // 005: el dispositivo checador se instala como PWA desde /checador (pantalla
    // completa, inicia en /checador). El resto del sistema no lleva manifiesto.
    if (location.pathname.indexOf('/checador') === 0) {
      var m = document.createElement('link'); m.rel = 'manifest'; m.href = '/checador.webmanifest'; document.head.appendChild(m);
      var i = document.createElement('link'); i.rel = 'apple-touch-icon'; i.href = '/checador-192.png'; document.head.appendChild(i);
    }
  </script>
  <script>
    // Paleta y modo antes de que arranque Angular, para que no parpadee la
    // paleta por defecto. Es la copia local; la que manda está en el servidor
    // (preferencias del usuario) y se aplica al entrar.
    try {
      var p = localStorage.getItem('rh_paleta'), t = localStorage.getItem('rh_tema');
      if (p && p !== 'indigo') document.documentElement.setAttribute('data-paleta', p);
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
