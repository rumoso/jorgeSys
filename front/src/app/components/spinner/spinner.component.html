@if (bProgressSpinner) {
  <div class="overlay">
    <div class="center">
      <ng-template [ngTemplateOutlet]="progressSpinner"></ng-template>
    </div>
  </div>
}
<ng-template #progressSpinner>
  <mat-progress-spinner
    [diameter]="diameter"
    [mode]="'indeterminate'"
    [color]="color"
    [strokeWidth]="strokeWidth">
  </mat-progress-spinner>
</ng-template>
